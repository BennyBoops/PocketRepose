plugins {
	id 'java-library'
	id 'maven-publish'
	id 'net.neoforged.moddev' version '2.0.144'
}

version =minecraft_version + "-" + mod_version + "-" + tag_lanzador
group = mod_group_id

base {
    archivesName = mod_named
}
java {
	toolchain.languageVersion = JavaLanguageVersion.of(21)
	withSourcesJar()
}


neoForge {
	version = project.neoforge_version

	accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

	runs {
		client {
			client()
		}
		server {
			server()
		}
		data {
			clientData()
		}
		configureEach {
			logLevel = org.slf4j.event.Level.INFO
		}
	}

	mods {
		"${project.mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

	repositories {
		mavenCentral()
	maven { url = 'https://maven.neoforged.net/releases' }
	 maven {
    name = "Jared's maven"
    url = "https://maven.blamejared.com/"
			 }
}
dependencies {
	    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
}

tasks.withType(ProcessResources).configureEach {
	var replaceProperties = [
			minecraft_version      : project.minecraft_version,
			minecraft_version_range: project.minecraft_version_range,
			neoforge_version       : project.neoforge_version,
			neoforge_version_range : project.neoforge_version_range,
			loader_version_range   : project.loader_version_range,
			mod_id                 : project.mod_id,
			mod_name               : project.mod_name,
			mod_license            : project.mod_license,
			mod_version            : project.mod_version,
			mod_authors            : project.mod_authors,
			mod_description        : project.mod_description
	]
	inputs.properties replaceProperties

	filesMatching(['META-INF/neoforge.mods.toml']) {
		expand replaceProperties
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

}

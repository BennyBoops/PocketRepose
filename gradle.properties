# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Architectury Loom builds this as a NeoForge mod (Yarn mappings, same as the Fabric version)
loom.platform=neoforge

minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
neoforge_version=21.1.265
# Patches Yarn so it lines up with NeoForge's Mojang-named runtime
yarn_neoforge_patch=1.21+build.4

# Mod Properties
mod_version=1.5.1-1.21.1-neoforge
maven_group=net.bennyboops.modid
archives_base_name=pocket-repose
